<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบเก็บเกียรติบัตร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#1f2933; --muted:#6b7684;
  --line:#dde2e8; --accent:#0f6b63; --accent-ink:#ffffff; --danger:#b42318; --ok:#17794a;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14181d;--card:#1c2229;--ink:#e8ecf0;--muted:#9aa5b1;--line:#2d3640;--accent:#3fb5a8;--accent-ink:#0c1512;--danger:#f97066;--ok:#4cc38a}
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Sarabun','Noto Sans Thai','Tahoma',sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:32px 20px 64px}
h1{font-size:1.9rem;margin:0 0 4px;font-weight:700}
.sub{color:var(--muted);margin:0 0 28px}
h2{font-size:1.2rem;margin:40px 0 14px;font-weight:700}
form{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px;display:grid;gap:18px}
label{display:block;font-weight:500;margin-bottom:6px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
input:focus-visible,select:focus-visible,button:focus-visible,.pick:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
.pick{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;cursor:pointer;display:block;background:var(--bg)}
.pick input{position:absolute;opacity:0;width:1px;height:1px}
.pick strong{color:var(--accent)}
#preview{max-width:100%;max-height:260px;border-radius:8px;display:none;margin:12px auto 0}
button{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:12px 20px;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
#msg{min-height:1.6em;margin:0;font-weight:500}
#msg.err{color:var(--danger)} #msg.ok{color:var(--ok)}
.list{display:grid;gap:12px}
.item{display:grid;grid-template-columns:96px 1fr;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.item img{width:96px;height:96px;object-fit:cover;border-radius:6px;background:var(--bg)}
.item h3{margin:0 0 2px;font-size:1.05rem}
.item p{margin:0;color:var(--muted);font-size:.95rem}
.empty{color:var(--muted);padding:20px;text-align:center;border:1px dashed var(--line);border-radius:10px}
.warn{background:#fff4e5;color:#7a4a00;border:1px solid #f0c987;border-radius:8px;padding:10px 14px;margin-bottom:20px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>ระบบเก็บเกียรติบัตร</h1>
  <p class="sub">อัปโหลดรูปเกียรติบัตรพร้อมบันทึกรายละเอียด</p>

  <div class="warn" id="cfgWarn">ยังไม่ได้ตั้งค่า Supabase — แก้ค่า SUPABASE_URL และ SUPABASE_ANON_KEY ในไฟล์ก่อนใช้งาน</div>

  <form id="form">
    <div>
      <label for="file">รูปเกียรติบัตร</label>
      <label class="pick" for="file">
        <input type="file" id="file" accept="image/*" required>
        <strong>เลือกรูปภาพ</strong> หรือถ่ายภาพ<br>
        <span id="fname" style="color:var(--muted)">ยังไม่ได้เลือกไฟล์</span>
        <img id="preview" alt="ตัวอย่างรูปเกียรติบัตร">
      </label>
    </div>

    <div>
      <label for="type">ประเภทเกียรติบัตร</label>
      <select id="type" required>
        <option value="">— เลือกประเภท —</option>
        <option>การแข่งขัน</option>
        <option>การอบรม / สัมมนา</option>
        <option>เรียนดี / ผลการเรียน</option>
        <option>กิจกรรมจิตอาสา</option>
        <option>ความประพฤติดี</option>
        <option>ศิลปะ / ดนตรี / กีฬา</option>
        <option value="อื่น ๆ">อื่น ๆ</option>
      </select>
    </div>

    <div class="row">
      <div><label for="date">วันที่ได้รับ</label><input type="date" id="date" required></div>
      <div><label for="time">เวลา</label><input type="time" id="time" required></div>
    </div>

    <div>
      <label for="issuer">หน่วยงานผู้มอบ</label>
      <input type="text" id="issuer" placeholder="เช่น สำนักงานเขตพื้นที่การศึกษา" required maxlength="200">
    </div>

    <button type="submit" id="btn">บันทึกเกียรติบัตร</button>
    <p id="msg" role="status"></p>
  </form>

  <h2>เกียรติบัตรที่บันทึกไว้</h2>
  <div class="list" id="list"><div class="empty">กำลังโหลด…</div></div>
</div>

<script>
/* ===== ตั้งค่า Supabase ===== */
const SUPABASE_URL = 'https://YOUR-PROJECT.supabase.co';
const SUPABASE_ANON_KEY = 'YOUR-ANON-KEY';
const TABLE = 'certificates';   // ชื่อตาราง
const BUCKET = 'certificates';  // ชื่อ Storage bucket (ตั้งเป็น public)
/* =========================== */

const $ = id => document.getElementById(id);
const configured = !SUPABASE_URL.includes('YOUR-PROJECT');
let db = null;
if (configured) db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
else $('cfgWarn').style.display = 'block';

const msg = (t, cls='') => { $('msg').textContent = t; $('msg').className = cls; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

$('file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  $('fname').textContent = f.name;
  const p = $('preview');
  p.src = URL.createObjectURL(f);
  p.style.display = 'block';
});

function fmt(date, time) {
  const d = new Date(date + 'T00:00:00').toLocaleDateString('th-TH', {year:'numeric', month:'long', day:'numeric'});
  return d + ' เวลา ' + String(time).slice(0,5) + ' น.';
}

async function load() {
  const list = $('list');
  if (!db) { list.innerHTML = '<div class="empty">ตั้งค่า Supabase เพื่อแสดงรายการ</div>'; return; }
  const { data, error } = await db.from(TABLE).select('*').order('created_at', {ascending:false});
  if (error) { list.innerHTML = '<div class="empty">โหลดรายการไม่สำเร็จ: ' + esc(error.message) + '</div>'; return; }
  if (!data.length) { list.innerHTML = '<div class="empty">ยังไม่มีเกียรติบัตร เริ่มจากอัปโหลดรูปด้านบน</div>'; return; }
  list.innerHTML = data.map(r => `
    <div class="item">
      <a href="${esc(r.image_url)}" target="_blank" rel="noopener"><img src="${esc(r.image_url)}" alt="เกียรติบัตร ${esc(r.cert_type)}"></a>
      <div>
        <h3>${esc(r.cert_type)}</h3>
        <p>${esc(fmt(r.issued_date, r.issued_time))}</p>
        <p>ผู้มอบ: ${esc(r.issuer)}</p>
      </div>
    </div>`).join('');
}

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  if (!db) return msg('ยังไม่ได้ตั้งค่า Supabase', 'err');
  const file = $('file').files[0];
  if (!file) return msg('กรุณาเลือกรูปภาพ', 'err');
  if (file.size > 10 * 1024 * 1024) return msg('ไฟล์ใหญ่เกิน 10 MB', 'err');

  $('btn').disabled = true;
  msg('กำลังอัปโหลด…');
  try {
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
    const path = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const up = await db.storage.from(BUCKET).upload(path, file, { contentType: file.type });
    if (up.error) throw up.error;
    const { data: pub } = db.storage.from(BUCKET).getPublicUrl(path);

    const ins = await db.from(TABLE).insert({
      cert_type: $('type').value,
      issued_date: $('date').value,
      issued_time: $('time').value,
      issuer: $('issuer').value.trim(),
      image_url: pub.publicUrl,
      image_path: path
    });
    if (ins.error) throw ins.error;

    msg('บันทึกเรียบร้อยแล้ว', 'ok');
    $('form').reset();
    $('preview').style.display = 'none';
    $('fname').textContent = 'ยังไม่ได้เลือกไฟล์';
    load();
  } catch (err) {
    msg('บันทึกไม่สำเร็จ: ' + (err.message || err), 'err');
  } finally {
    $('btn').disabled = false;
  }
});

load();
</script>
</body>
</html>
